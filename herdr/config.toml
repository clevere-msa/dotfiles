# Match the established tmux workflow while keeping Herdr's agent-aware UI.
onboarding = false

[theme]
name = "terminal"

[terminal]
default_shell = "/usr/bin/bash"
shell_mode = "login"
new_cwd = "follow"

[update]
channel = "stable"

[keys]
prefix = "ctrl+a"
# prefix+r is resize_mode by default, which silently wins over this rebind and
# makes Ctrl-A r a no-op. Resizing is already on prefix+shift+h/j/k/l below.
resize_mode = ""
reload_config = "prefix+r"
new_tab = "prefix+c"
rename_tab = ""
previous_tab = "prefix+p"
next_tab = "prefix+n"
cycle_pane_next = "prefix+right"
cycle_pane_previous = "prefix+left"
last_pane = ""
switch_tab = "prefix+1..9"
edit_scrollback = ""
focus_pane_left = ["prefix+h", "alt+left"]
focus_pane_down = ["prefix+j", "prefix+down", "alt+down"]
focus_pane_up = ["prefix+k", "prefix+up", "alt+up"]
focus_pane_right = ["prefix+l", "alt+right"]
split_vertical = ["prefix+v", "prefix+|", "prefix+backslash", "prefix+shift+backslash"]
split_horizontal = "prefix+minus"
resize_pane_left = "prefix+shift+h"
resize_pane_down = "prefix+shift+j"
resize_pane_up = "prefix+shift+k"
resize_pane_right = "prefix+shift+l"
# swap_pane_* default to prefix+shift+h/j/k/l too, and like resize_mode above
# the default silently wins over the rebind. Clear them so prefix+Shift+H/J/K/L
# resize rather than move panes.
swap_pane_left = ""
swap_pane_down = ""
swap_pane_up = ""
swap_pane_right = ""
toggle_sidebar = "prefix+ctrl+e"

[[keys.command]]
key = "prefix+e"
type = "shell"
command = "/home/clevere/.config/herdr/start-codex.sh"
description = "start Codex in a new tab"

[[keys.command]]
key = "prefix+shift+c"
type = "shell"
command = "/home/clevere/.config/herdr/start-claude.sh"
description = "start Claude in a new tab"

[[keys.command]]
key = "prefix+a"
type = "shell"
command = "herdr plugin action invoke last-tab --plugin local.tmux-tabs"
description = "select the last used tab"

[[keys.command]]
key = "prefix+q"
type = "shell"
command = "herdr plugin pane open --plugin local.tmux-tabs --entrypoint picker"
description = "show numbered tabs"

[[keys.command]]
key = "prefix+shift+o"
type = "shell"
command = "/home/clevere/.config/herdr/handoff-tab.sh"
description = "hand this Claude session off to a new seeded tab"

[[keys.command]]
key = "prefix+comma"
type = "shell"
command = "herdr plugin pane open --plugin local.tmux-tabs --entrypoint rename"
description = "rename tab without its number prefix"

[ui]
# mouse_capture = true, restored 2026-09-18 once the real root cause was found.
#
# With capture on, herdr does the copy itself. On Wayland it does that by
# spawning `wl-copy` -- the 0.9.1 binary references wl-copy three times and
# never references xclip, xsel or clip.exe. wl-clipboard was NOT installed on
# this machine, so that spawn failed silently: the "Copied to clipboard" toast
# still fired, because the toast is a UI event and not a write result. That is
# herdr issue #4341, which on this box was a missing package, not a herdr
# defect -- which is why upgrading 0.8.2 -> 0.9.1 changed nothing.
#
# It is NOT an OSC 52 problem. The comment that used to sit here said it was,
# and that was wrong; #4341's own diagnosis says OSC 52 forwarding works fine
# and the failure is in the helper path.
#
# Fixed by installing wl-clipboard 2.2.1 (2026-09-18 19:56). Verified the same
# day: a wl-copy write reads back through both `wl-paste` and
# `powershell.exe -NoProfile -Command Get-Clipboard`, so the WSLg Wayland ->
# Windows clipboard bridge works.
#
# Capture on gives click-to-select-tab (the reason for this change), plus
# click-to-focus, drag-resize and right-click menus -- and plain click+drag
# still copies, through herdr now instead of Windows Terminal. No Shift needed.
#
# If copy ever silently breaks again, check `command -v wl-copy` FIRST.
# And remember: editing this file does nothing to the running server until
# `herdr server reload-config` (or prefix+r) reports "status":"applied".
mouse_capture = true
copy_on_select = true
sidebar_start_collapsed = true
pane_borders = true
pane_outer_borders = false
pane_scrollbars = false
pane_gaps = false
tab_bar_position = "bottom"
prompt_new_tab_name = false
window_title = "{hostname}: {workspace}"

[session]
resume_agents_on_restore = true

[experimental]
pane_history = false

# Match the established tmux workflow while keeping Herdr's agent-aware UI.
onboarding = false

[theme]
name = "terminal"

[terminal]
default_shell = "/usr/bin/bash"
shell_mode = "login"
new_cwd = "follow"

[update]
channel = "stable"

[keys]
prefix = "ctrl+a"
# prefix+r is resize_mode by default, which silently wins over this rebind and
# makes Ctrl-A r a no-op. Resizing is already on prefix+shift+h/j/k/l below.
resize_mode = ""
reload_config = "prefix+r"
new_tab = "prefix+c"
rename_tab = ""
previous_tab = "prefix+p"
next_tab = "prefix+n"
cycle_pane_next = "prefix+right"
cycle_pane_previous = "prefix+left"
last_pane = ""
switch_tab = "prefix+1..9"
edit_scrollback = ""
focus_pane_left = ["prefix+h", "alt+left"]
focus_pane_down = ["prefix+j", "prefix+down", "alt+down"]
focus_pane_up = ["prefix+k", "prefix+up", "alt+up"]
focus_pane_right = ["prefix+l", "alt+right"]
split_vertical = ["prefix+v", "prefix+|", "prefix+backslash", "prefix+shift+backslash"]
split_horizontal = "prefix+minus"
resize_pane_left = "prefix+shift+h"
resize_pane_down = "prefix+shift+j"
resize_pane_up = "prefix+shift+k"
resize_pane_right = "prefix+shift+l"
toggle_sidebar = "prefix+ctrl+e"

[[keys.command]]
key = "prefix+e"
type = "shell"
command = "/home/clevere/.config/herdr/start-codex.sh"
description = "start Codex in a new tab"

[[keys.command]]
key = "prefix+shift+c"
type = "shell"
command = "/home/clevere/.config/herdr/start-claude.sh"
description = "start Claude in a new tab"

[[keys.command]]
key = "prefix+a"
type = "shell"
command = "herdr plugin action invoke last-tab --plugin local.tmux-tabs"
description = "select the last used tab"

[[keys.command]]
key = "prefix+q"
type = "shell"
command = "herdr plugin pane open --plugin local.tmux-tabs --entrypoint picker"
description = "show numbered tabs"

[[keys.command]]
key = "prefix+comma"
type = "shell"
command = "herdr plugin pane open --plugin local.tmux-tabs --entrypoint rename"
description = "rename tab without its number prefix"

[ui]
# Keep false: Windows Terminal owns drag-select and copy. Set 2026-09-18.
#
# With capture on, herdr does the copy itself and on WSL reaches the Windows
# clipboard via OSC 52. That path is broken by herdr issue #4341 (open against
# both 0.9.0 and 0.9.1): the "Copied to clipboard" toast fires, nothing lands.
# `mouse_capture = false` is one of the two workarounds the issue lists.
# Updating 0.8.2 -> 0.9.1 did NOT fix it.
#
# With capture off, herdr never enables mouse reporting toward the outer
# terminal, so Windows Terminal does the selection natively and its
# "copyOnSelect": true copies on drag. No OSC 52 involved, so #4341 and
# Windows Terminal's focus-gating of OSC 52 writes (microsoft/terminal
# PR #19357) are both bypassed.
#
# Cost, accepted: no click-to-focus, drag-resize or right-click menus in
# herdr, and drags bleed across panes in split layouts.
#
# The prior comment here claimed the opposite and said it was "verified
# empirically 2026-09-18 ... tested twice on reload". The server log shows no
# reload_config that day at all, so that test never ran. Do not flip this
# without running `herdr server reload-config` and checking the clipboard --
# an edit alone does not reach the running server.
mouse_capture = false
copy_on_select = true
sidebar_start_collapsed = true
pane_borders = true
pane_outer_borders = false
pane_scrollbars = false
pane_gaps = false
tab_bar_position = "bottom"
prompt_new_tab_name = false
window_title = "{hostname}: {workspace}"

[session]
resume_agents_on_restore = true

[experimental]
pane_history = false
